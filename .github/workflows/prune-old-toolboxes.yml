name: Prune Old Toolbox Images

on:
  workflow_dispatch:
    inputs:
      backends:
        description: Comma-separated backends to prune (e.g. "vulkan-radv-slot-checkpoints") or "all"
        default: all
      keep:
        description: Number of latest tags to keep
        default: "3"
  workflow_run:
    workflows: ["Build & Publish AMD Strix Halo Toolboxes"]
    types: [completed]   # runs after success/failure/cancel
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      # GHCR package is linked to this repo (pushed via GITHUB_TOKEN), so the
      # built-in token can list & delete its versions with packages: write.
      OWNER: ${{ github.repository_owner }}
      PACKAGE: amd-strix-halo-toolboxes
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine backend list
        id: mk
        shell: bash
        run: |
          IN='${{ github.event.inputs.backends }}'
          if [[ "$IN" == "all" || -z "$IN" ]]; then
            JSON='["vulkan-radv-slot-checkpoints","vulkan-radv-cachyllama"]'
          else
            IN_CLEAN=$(echo "$IN" | tr -d '[:space:]')
            JSON='["'${IN_CLEAN//,/\",\"}'"]'
          fi
          echo "list=${JSON}" >> "$GITHUB_OUTPUT"

      - name: Prune old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ github.event.inputs.keep }}
        shell: bash
        run: |
          set -euo pipefail
          KEEP="${KEEP:-3}"
          BACKENDS='${{ steps.mk.outputs.list }}'
          mapfile -t ARR < <(jq -r '.[]' <<< "$BACKENDS")

          OWNER_LC="${OWNER,,}"
          api="https://api.github.com"
          auth_hdr="Authorization: Bearer ${GH_TOKEN}"
          accept_hdr="Accept: application/vnd.github+json"
          versions_url="${api}/users/${OWNER_LC}/packages/container/${PACKAGE}/versions"

          # Collect every package version (id, created_at, tags) across all pages.
          all_versions="$(mktemp)"
          page=1
          while : ; do
            resp=$(curl -fsSL -H "$auth_hdr" -H "$accept_hdr" \
              "${versions_url}?per_page=100&page=${page}")
            count=$(jq 'length' <<< "$resp")
            (( count == 0 )) && break
            jq -c '.[] | {id: .id, created_at: .created_at, tags: (.metadata.container.tags // [])}' \
              <<< "$resp" >> "$all_versions"
            (( count < 100 )) && break
            page=$((page+1))
          done

          for B in "${ARR[@]}"; do
            echo ""
            echo "=== Backend: ${B} (keeping latest ${KEEP}) ==="
            # Immutable version tags look like "<backend>_<timestamp>"; the moving
            # channel tag "<backend>" rides on the newest version, so it stays safe.
            mapfile -t IDS < <(
              jq -s -r --arg b "${B}_" \
                'map(select(.tags | any(startswith($b)))) | sort_by(.created_at) | reverse | .[].id' \
                "$all_versions"
            )
            total=${#IDS[@]}
            echo "Found ${total} immutable version(s) for ${B}."
            if (( total <= KEEP )); then
              echo "Nothing to delete."
              continue
            fi
            to_delete=("${IDS[@]:KEEP}")
            for id in "${to_delete[@]}"; do
              echo "Deleting version ${id}..."
              curl -s -X DELETE -H "$auth_hdr" -H "$accept_hdr" \
                "${versions_url}/${id}" \
                -o /dev/null -w "%{http_code}\n" | grep -Eq "^(202|204)$" \
                && echo "✔ Deleted" || echo "✖ Failed"
            done
          done
