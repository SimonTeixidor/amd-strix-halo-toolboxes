name: Build & Publish strix-halo-rocm

# Builds the production image: SimonTeixidor/llama.cpp @ strix-halo-rocm on ROCm 10.0 with
# pwilkin's patched ROCr + HIP (toolboxes/Dockerfile.strix-halo-rocm).

on:
  workflow_dispatch:
    inputs:
      llama_commit:
        description: llama.cpp commit to build (default - head of strix-halo-rocm)
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: amd-strix-halo-toolboxes
  BACKEND: strix-halo-rocm
  LLAMA_URL: https://github.com/SimonTeixidor/llama.cpp.git
  LLAMA_BRANCH: strix-halo-rocm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          docker builder prune --all --force
          echo "After cleanup:" && df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve llama.cpp commit
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ inputs.llama_commit }}'
          if [[ -z "$SHA" ]]; then
            SHA=$(git ls-remote "$LLAMA_URL" "refs/heads/$LLAMA_BRANCH" | cut -f1)
          fi
          [[ -n "$SHA" ]] || { echo "could not resolve $LLAMA_BRANCH"; exit 1; }
          echo "LLAMA_COMMIT=$SHA" >> "$GITHUB_ENV"
          OWNER="${{ github.repository_owner }}"
          echo "IMAGE_REPO=${REGISTRY}/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_TS=$(date +%Y%m%dT%H%M%S)" >> "$GITHUB_ENV"
          echo "Building $LLAMA_BRANCH @ $SHA"

      - name: Build & push ${{ env.BACKEND }}
        working-directory: toolboxes
        shell: bash
        run: |
          set -euo pipefail
          LI="llama-${BACKEND}"
          IMM="${IMAGE_REPO}:${BACKEND}_${BUILD_TS}_${LLAMA_COMMIT:0:9}"
          CHN="${IMAGE_REPO}:${BACKEND}"

          echo "→ Building Dockerfile.${BACKEND}"
          docker build --no-cache \
            --build-arg LLAMA_COMMIT="${LLAMA_COMMIT}" \
            --build-arg JOBS="$(nproc)" \
            -t "${LI}" -f "Dockerfile.${BACKEND}" .

          echo "→ Running smoke test..."
          docker run --rm "${LI}" cat /opt/strix/build-info
          docker run --rm "${LI}" llama-server --version || { status=$?; echo "llama-server exited with status $status"; [[ $status -eq 0 || $status -eq 1 ]]; }

          echo "→ Tag & push immutable → ${IMM}"
          docker tag "${LI}" "${IMM}"
          docker push "${IMM}"

          echo "→ Tag & push channel → ${CHN}"
          docker tag "${IMM}" "${CHN}"
          docker push "${CHN}"
